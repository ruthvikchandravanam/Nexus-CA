<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus CA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/nexus.css">
</head>
<body>
<div class="auth">
  <div class="auth__brandcol">
    <svg width="56" height="56" viewBox="0 0 32 32" fill="none" style="color:#fff">
      <path d="M9 25 V7 L23 25 V7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="9" cy="7" r="3.5" fill="currentColor"/>
      <circle cx="16" cy="16" r="3" fill="#22D3EE"/>
      <circle cx="23" cy="25" r="3.5" fill="currentColor"/>
    </svg>
    <div style="font-size:28px;font-weight:600;letter-spacing:.4px;">Nexus CA</div>
    <div class="tagline">Anchoring Trust.</div>
  </div>
  <div class="auth__formcol">
    <form class="auth__form" onsubmit="return false">
      <h2 class="h2">Verify Your Identity</h2>
      <p class="sub">A verification code has been sent to your registered email address.</p>
      <div class="field">
        <label for="c">Verification Code</label>
        <input class="input mfa-input" id="c" type="text" inputmode="numeric" maxlength="6" placeholder="000000" value="418205">
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Verify</button>
      <div style="text-align:center;margin-top:var(--space-3)">
        <a class="btn btn--ghost btn--sm" href="#">Resend code</a>
      </div>
    </form>
  </div>
</div>
<div class="screen-tag">S-001 · /login/mfa</div>
</body>
</html>
